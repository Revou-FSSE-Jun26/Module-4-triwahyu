# REQ-FND-8: every push and pull request runs lint, tests (on PostgreSQL), migrations, build and the repo gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revotask
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: revotask_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U revotask -d revotask_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://revotask:ci_only_password@localhost:5432/revotask_test
      DATABASE_URL: postgresql://revotask:ci_only_password@localhost:5432/revotask_app
      APP_ENV: development
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create the test database (fixtures refuse names without 'test')
        run: PGPASSWORD=ci_only_password psql -h localhost -U revotask -d revotask_app -c 'CREATE DATABASE revotask_test;'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
      - name: Apply migrations and check for drift
        run: |
          flask --app app:create_app db upgrade
          flask --app app:create_app db check
      - name: OpenAPI contract is current
        run: python ../scripts/export_openapi.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
      API_BASE_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  repo-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guidelines, traceability and generated files
        run: |
          python scripts/check_guidelines.py
          python scripts/check_traceability.py
          python scripts/build_specs.py --check
          python scripts/check_encoding.py

  # Manual: run the Playwright suite against deployed URLs (REQ-E2E-1).
  e2e-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
